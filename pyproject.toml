[project]
name = "climate-impacts-agent"
version = "0.1.0"
description = "Agent for exploring ISIMIP climate impact projections at a given global warming level"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "streamlit>=1.40",
    "pydantic>=2.9",
    "langgraph>=0.2",
    "crewai>=0.80",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "xarray>=2024.9",
    "netCDF4>=1.7",
    "numpy>=2.0",
    "pydeck>=0.9",
]

[project.optional-dependencies]
ml = [
    "torch>=2.4",
    "transformers>=4.45",
    "peft>=0.13",
    # "bitsandbytes>=0.44",
    "sentence-transformers>=3.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/climate_agent"]
