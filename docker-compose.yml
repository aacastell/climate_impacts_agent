services:
    api:
        build: .
        command: uvicorn climate_agent.api.app:app --host 0.0.0.0 --port 8000 --reload
        ports:
            - "8000:8000"
        env_file:
            - .env
        environment:
            - ORCHESTRATION_BACKEND=graph
        volumes:
            - ./src:/app/src
        
    frontend:
        build: .
        command: streamlit run src/climate_agent/frontend/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
        ports:
            - "8501:8501"
        env_file:
            - .env
        environment:
            - API_BASE_URL=http://api:8000
        volumes:
            - ./src:/app/src
        depends_on:
            - api
        