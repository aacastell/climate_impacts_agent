name: CI

# Manual-only while still actively in development — automatic triggers commented out below,
# restore them once the project is stable enough for CI to run against every commit for real.
on:
  workflow_dispatch:
  # push:
  # pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  dvc-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e .
      # `dvc dag` validates stage topology/structure without touching any real data — catches
      # config drift like the item-13 stale-corpus bug (a stage's deps/outs no longer matching
      # reality) at CI time instead of only when someone runs it locally.
      #
      # `dvc repro --dry` was tried here too but doesn't work in a fresh checkout: for a stage
      # whose deps are themselves another stage's outs (train_emulator depends on the cached
      # climate files fetch_tas_baseline etc. produce), dry-run tries to read that dependency
      # file to hash it rather than gracefully reporting "would run" — and since data/cache/ is
      # gitignored, that file doesn't exist yet in CI, so it hard-fails (exit 255, reproduced
      # locally via a genuine fresh clone before writing this). Real end-to-end validation of
      # train_emulator with real data happens in ct.yml instead, which actually has the data.
      - name: Validate DVC pipeline structure
        run: dvc dag
